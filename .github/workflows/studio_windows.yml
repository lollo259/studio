name: 'Studio: Windows'

# One folder with everything: Score, Tape, Mail (Thunderbird), the sounds (already
# unpacked and mapped) and Score.exe / Tape.exe at the top. Runs after a successful
# Score or Tape build. Run by hand on another branch (Actions > Run workflow), it takes
# that branch's Score build if there is one, otherwise main's, and main's Tape build.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Score: Windows', 'Tape: Windows']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['studio/**', 'sketch/**', '.github/workflows/studio_windows.yml']

concurrency:
  group: studio-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      studio_name: ${{ steps.name.outputs.studio_name }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq p7zip-full gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

    - name: Latest Score build (this branch)
      id: score_branch
      if: ${{ github.ref_name != 'main' }}
      continue-on-error: true
      uses: dawidd6/action-download-artifact@v28
      with:
        workflow: score_windows.yml
        workflow_conclusion: success
        branch: ${{ github.ref_name }}
        name: 'Score_.*'
        name_is_regexp: true
        path: dl/score

    - name: Latest Score build
      if: ${{ github.ref_name == 'main' || steps.score_branch.outcome != 'success' }}
      uses: dawidd6/action-download-artifact@v28
      with:
        workflow: score_windows.yml
        workflow_conclusion: success
        branch: main
        name: 'Score_.*'
        name_is_regexp: true
        path: dl/score

    - name: Latest Tape build
      uses: dawidd6/action-download-artifact@v28
      with:
        workflow: tape_windows.yml
        workflow_conclusion: success
        branch: main
        name: 'Tape_.*'
        name_is_regexp: true
        path: dl/tape

    - name: Put the apps in place
      shell: bash
      run: |
        set -e
        mkdir -p Studio x/score x/tape
        # each app arrives as a .7z with its own folder inside: unpack, then take the folder that holds bin/
        for z in $(find dl/score -name '*.7z'); do 7z x -y -ox/score "$z" > /dev/null; done
        for z in $(find dl/tape -name '*.7z'); do 7z x -y -ox/tape "$z" > /dev/null; done
        score_bin=$(dirname "$(find x/score -iname 'LaurenceWhoScore*.exe' -path '*/bin/*' | head -1)")
        tape_bin=$(dirname "$(find x/tape -iname 'Audacity4.exe' -path '*/bin/*' | head -1)")
        test -n "$score_bin" && test -n "$tape_bin"
        mv "$(dirname "$score_bin")" Studio/Score
        mv "$(dirname "$tape_bin")" Studio/Tape
        echo "SCORE_EXE=$(basename "$(find Studio/Score/bin -maxdepth 1 -iname 'LaurenceWhoScore*.exe' | head -1)")" >> $GITHUB_ENV
        ls Studio Studio/Score/bin | head -40

    - name: Score.exe and Tape.exe
      shell: bash
      run: |
        set -e
        cd studio/launcher
        echo "1 ICON \"$GITHUB_WORKSPACE/score/share/icons/AppIcon/MS4_AppIcon.ico\"" > score.rc
        echo "1 ICON \"$GITHUB_WORKSPACE/tape/share/icons/AppIcon/AU4_AppIcon.ico\"" > tape.rc
        x86_64-w64-mingw32-windres score.rc -O coff -o score.res
        x86_64-w64-mingw32-windres tape.rc -O coff -o tape.res
        echo "1 ICON \"$GITHUB_WORKSPACE/studio/icons/studio.ico\"" > studio.rc
        x86_64-w64-mingw32-windres studio.rc -O coff -o studio.res
        x86_64-w64-mingw32-gcc -municode -mwindows -O2 -static "-DTARGET=L\"Score\\\\bin\\\\${SCORE_EXE}\"" launcher.c score.res -o "$GITHUB_WORKSPACE/Studio/Score.exe"
        x86_64-w64-mingw32-gcc -municode -mwindows -O2 -static '-DTARGET=L"Tape\\bin\\Audacity4.exe"' launcher.c tape.res -o "$GITHUB_WORKSPACE/Studio/Tape.exe"
        # Studio.exe: the one window with Score and Tape inside (built with Score)
        if [ -f "$GITHUB_WORKSPACE/Studio/Score/bin/Studio.exe" ]; then
          x86_64-w64-mingw32-gcc -municode -mwindows -O2 -static '-DTARGET=L"Score\\bin\\Studio.exe"' launcher.c studio.res -o "$GITHUB_WORKSPACE/Studio/Studio.exe"
          # Mail.exe: Thunderbird on its own, with Studio's profile and look
          echo "1 ICON \"$GITHUB_WORKSPACE/studio/icons/mail.ico\"" > mail.rc
          x86_64-w64-mingw32-windres mail.rc -O coff -o mail.res
          x86_64-w64-mingw32-gcc -municode -mwindows -O2 -static '-DTARGET=L"Score\\bin\\Studio.exe"' '-DEXTRA=L"--mail"' launcher.c mail.res -o "$GITHUB_WORKSPACE/Studio/Mail.exe"
          # Sketch.exe: Blender with the Sketch template, on its own
          echo "1 ICON \"$GITHUB_WORKSPACE/studio/icons/sketch.ico\"" > sketch.rc
          x86_64-w64-mingw32-windres sketch.rc -O coff -o sketch.res
          x86_64-w64-mingw32-gcc -municode -mwindows -O2 -static '-DTARGET=L"Sketch\\blender.exe"' '-DEXTRA=L"--app-template sketch"' launcher.c sketch.res -o "$GITHUB_WORKSPACE/Studio/Sketch.exe"
        fi
        ls -la "$GITHUB_WORKSPACE/Studio"

    - name: Mail (Thunderbird)
      shell: bash
      run: |
        set -e
        # the official Thunderbird for Windows (latest ESR, en-US), checked against Mozilla's checksums
        curl -fsSL https://product-details.mozilla.org/1.0/thunderbird_versions.json -o /tmp/tb_versions.json
        cat /tmp/tb_versions.json
        ver=$(python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("THUNDERBIRD_ESR") or d["LATEST_THUNDERBIRD_VERSION"])' /tmp/tb_versions.json)
        echo "Thunderbird $ver"
        base="https://archive.mozilla.org/pub/thunderbird/releases/$ver"
        file="win64/en-US/Thunderbird Setup $ver.exe"
        mkdir -p dl/mail x/mail
        curl -fsSL "$base/SHA256SUMS" -o dl/mail/SHA256SUMS
        curl -fsSL "$base/${file// /%20}" -o dl/mail/setup.exe
        want=$(grep -F "  $file" dl/mail/SHA256SUMS | head -1 | cut -d' ' -f1)
        have=$(sha256sum dl/mail/setup.exe | cut -d' ' -f1)
        echo "want $want"; echo "have $have"
        test -n "$want" && test "$want" = "$have"
        # the installer is a 7-Zip archive: core/ is the whole app
        7z x -y -ox/mail dl/mail/setup.exe > /dev/null
        test -f x/mail/core/thunderbird.exe
        mv x/mail/core Studio/Mail
        echo "$ver" > Studio/Mail/studio-thunderbird-version.txt
        # Studio's profile files (copied into the Mail profile on every start) and policies
        mkdir -p Studio/Mail/studio-profile/chrome/fonts Studio/Mail/distribution
        cp -r studio/mail/profile/. Studio/Mail/studio-profile/
        cp score/fonts/jost/Jost-Regular.ttf score/fonts/jost/Jost-Bold.ttf score/fonts/jost/OFL.txt Studio/Mail/studio-profile/chrome/fonts/
        cp studio/mail/distribution/policies.json Studio/Mail/distribution/
        find Studio/Mail/studio-profile Studio/Mail/distribution -type f
        du -sh Studio/Mail

    - name: Sketch (Blender)
      shell: bash
      run: |
        set -e
        # the official portable Blender for Windows (newest release), checked against blender.org's checksums
        dir=$(curl -fsSL https://download.blender.org/release/ | grep -oE 'Blender[0-9]+\.[0-9]+/' | sort -uV | tail -1)
        list=$(curl -fsSL "https://download.blender.org/release/$dir")
        file=$(echo "$list" | grep -oE 'blender-[0-9.]+-windows-x64\.zip' | sort -uV | tail -1)
        ver=${file#blender-}; ver=${ver%-windows-x64.zip}
        echo "Blender $ver ($dir$file)"
        mkdir -p dl/sketch
        curl -fsSL "https://download.blender.org/release/$dir$file" -o dl/sketch/blender.zip
        if curl -fsSL "https://download.blender.org/release/${dir}blender-$ver.sha256" -o dl/sketch/sums; then
          want=$(grep -F "$file" dl/sketch/sums | head -1 | cut -d' ' -f1)
          have=$(sha256sum dl/sketch/blender.zip | cut -d' ' -f1)
          echo "want $want"; echo "have $have"
          test -n "$want" && test "$want" = "$have"
        fi
        unzip -q dl/sketch/blender.zip -d dl/sketch/x
        mv dl/sketch/x/blender-*-windows-x64 Studio/Sketch
        test -f Studio/Sketch/blender.exe
        rm -rf dl/sketch
        # Sketch = Blender with the Sketch application template, built in
        vdir=$(ls Studio/Sketch | grep -E '^[0-9]+\.[0-9]+$' | head -1)
        mkdir -p "Studio/Sketch/$vdir/scripts/startup/bl_app_templates_system/sketch"
        cp -r sketch/template/. "Studio/Sketch/$vdir/scripts/startup/bl_app_templates_system/sketch/"
        echo "$ver" > Studio/Sketch/studio-blender-version.txt
        du -sh Studio/Sketch

    - name: Sounds
      shell: bash
      run: |
        set -e
        mkdir -p Studio/Sounds
        cd Studio/Sounds
        git clone --depth 1 https://github.com/sfzinstruments/SalamanderGrandPiano.git "Salamander Grand Piano"
        git clone --depth 1 https://github.com/sgossner/VSCO-2-CE.git "VSCO 2 CE"
        git clone --depth 1 https://github.com/mrbumpy409/GeneralUser-GS.git gu
        mkdir -p "GeneralUser GS"
        mv gu/GeneralUser-GS.sf2 "GeneralUser GS/"
        cp gu/LICENSE.txt "GeneralUser GS/" 2>/dev/null || true
        rm -rf gu "Salamander Grand Piano/.git" "VSCO 2 CE/.git"
        # VSCO ships only recordings: write the instrument maps (one .sfz per instrument and articulation)
        cd "VSCO 2 CE"
        find . -type f -iname '*.wav' | sed 's#^\./##' | sort > /tmp/vsco_files.txt
        python3 -I "$GITHUB_WORKSPACE/studio/sounds/make_vsco_sfz.py" /tmp/vsco_files.txt . "Keys/Upright Piano/MappingChart.txt" "$GITHUB_WORKSPACE/studio/sounds/vsco_gains.json"
        ls *.sfz | wc -l
        cd ..
        du -sh *

    - name: Read me
      shell: bash
      run: |
        printf '%s\r\n' \
          'Laurence Who Studio' \
          '' \
          'Studio.exe - Score, Tape and Mail in one window, linked' \
          'Score.exe  - write music (Score)' \
          'Tape.exe   - record and play (Tape)' \
          'Mail       - Thunderbird, inside Studio (add your accounts in its account setup)' \
          'Sounds     - the instruments Tape plays, ready to use' \
          '' \
          'Keep everything together in this folder: Score and Tape find each other and the sounds here.' \
          'In Score: File > Send to Tape. In Tape: Add track > Instrument, Record > Open last take in Score.' \
          > "Studio/Start here.txt"
        echo "STUDIO_NAME=Studio_$(date -u +%Y%m%d-%H%M)_Windows" >> $GITHUB_ENV

    - name: Name
      id: name
      shell: bash
      run: echo "studio_name=$STUDIO_NAME" >> $GITHUB_OUTPUT

    - name: Upload Studio
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.STUDIO_NAME }}
        path: Studio/
        compression-level: 0
        retention-days: 1 # only the installer job needs it; you download the Setup

  installer:
    needs: studio
    runs-on: windows-2022
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Get the Studio folder
      uses: actions/download-artifact@v7
      with:
        name: ${{ needs.studio.outputs.studio_name }}
        path: Studio

    - name: Check Sketch loads in Blender
      shell: pwsh
      run: |
        $py = "import bpy, bl_app_template_utils; bl_app_template_utils.activate(template_id='sketch'); ops=[o for o in dir(bpy.ops.sketch)]; print('SKETCH OK', bpy.app.version_string, len(ops), 'tools')"
        & "Studio\Sketch\blender.exe" --background --factory-startup --python-expr $py 2>&1 | Tee-Object -Variable out
        if (-not ($out -match "SKETCH OK")) { throw "Sketch did not load" }

    - name: Inno Setup
      shell: pwsh
      run: |
        # 6.5.2 or newer: a single Setup.exe can be up to ~4 GB
        choco upgrade -y innosetup --no-progress | Out-Null
        $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "${env:ProgramFiles}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Sort-Object { $_.VersionInfo.FileVersion } | Select-Object -Last 1
        if (-not $iscc) { throw "ISCC.exe not found" }
        "Inno Setup $($iscc.VersionInfo.FileVersion) at $($iscc.FullName)"
        "ISCC=$($iscc.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        Get-ChildItem Studio | Select-Object Name

    - name: Build Studio Setup
      shell: pwsh
      working-directory: studio/installer
      run: |
        $iscc = $env:ISCC
        $ver = (Get-Date -Format "yyyy.MM.dd")
        & $iscc "/DSrcDir=$env:GITHUB_WORKSPACE\Studio" "/DAppVersion=$ver" studio.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Get-ChildItem output | Select-Object Name, Length

    - name: Upload Studio Setup
      uses: actions/upload-artifact@v7
      with:
        name: Studio_Setup_${{ needs.studio.outputs.studio_name }}
        path: studio/installer/output/
        compression-level: 0
        retention-days: 14
